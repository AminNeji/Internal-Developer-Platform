<header class="topbar">
  <a class="brand" routerLink="/environments">
    <span class="mark"></span>
    <span class="name">IDP Console</span>
  </a>

  @if (auth.user(); as user) {
    <div class="account">
      <img class="avatar" [src]="user.avatarUrl" alt="" width="24" height="24" />
      <span class="login">{{ user.login }}</span>
      <button type="button" class="btn btn--ghost" (click)="auth.logout()">Sign out</button>
    </div>
  }
</header>

@if (auth.user()) {

  <router-outlet />

} @else if (auth.checked()) {

  <main class="signin">
    <div class="panel signin-card">
      <h1>Sign in</h1>
      <p>Use your GitHub account to create and manage environments.</p>
      @if (denied) {
        <p class="denied">That GitHub account isn't allowed on this platform.</p>
      }
      <button type="button" class="btn btn--primary" (click)="auth.login()">Sign in with GitHub</button>
    </div>
  </main>

}
