spring.application.name=idp-backend

server.port=8082
spring.datasource.url=jdbc:postgresql://localhost:5433/idp_project
spring.datasource.username=postgres
spring.datasource.password=2003

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

git.repo.url=https://github.com/AminNeji/Internal-Developer-Platform.git
git.username=AminNeji
git.password=${GIT_PASSWORD}

argocd.url=${ARGOCD_URL:https://localhost:8080}
argocd.token=${ARGOCD_TOKEN:}

spring.data.redis.password=redispassword


spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/api/login/oauth2/code/{registrationId}
spring.session.jdbc.initialize-schema=always
server.forward-headers-strategy=native
idp.allowed-users=${IDP_ALLOWED_USERS:AminNeji}


# nothing uses Redis yet and the cluster has no redis host; without this /actuator/health
# reports DOWN (503) and the ALB marks every backend pod unhealthy
management.health.redis.enabled=false
