# Template for k8s/secret.yml, which is gitignored. Kept outside k8s/ so ArgoCD never applies it.
# Copy to secret.yml, fill in the values, then apply it by hand:
#   kubectl apply -f k8s/secret.yml
# It lives outside Git on purpose: ArgoCD deploys everything in k8s/ from Git,
# so a committed secret would publish these values.
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: idp-project
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: ""
  GIT_PASSWORD: ""
  SPRING_DATA_REDIS_PASSWORD: ""
  ARGOCD_TOKEN: ""
  # from the "IDP Prod" GitHub OAuth App (callback https://idplatform.tech/api/login/oauth2/code/github)
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
