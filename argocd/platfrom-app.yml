apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: idp-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/AminNeji/Internal-Developer-Platform.git'
    targetRevision: dev
    path: k8s/
    directory:
      recurse: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: idp-project
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
