{{- range .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .serviceName }}-deployment
spec:
  replicas: {{ $.Values.replicas }}
  selector:
    matchLabels:
      app: {{ .serviceName }}
  template:
    metadata:
      labels:
        app: {{ .serviceName }}
    spec:
      containers:
        - name: {{ .serviceName }}
          image: {{ .image | default "nginx:alpine" | quote }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .port }}
          {{- with .env }}
          env:
            {{- range $name, $value := . }}
            - name: {{ $name | quote }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .healthPath | default "/" | quote }}
              port: {{ .port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
{{- end }}
