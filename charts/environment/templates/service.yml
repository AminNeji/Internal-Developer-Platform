{{- range .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .serviceName }}-service
  annotations:
    # per Service, because each one becomes its own target group on the load balancer
    alb.ingress.kubernetes.io/healthcheck-path: {{ .healthPath | default "/" | quote }}
    alb.ingress.kubernetes.io/success-codes: "200-399"
spec:
  selector:
    app: {{ .serviceName }}
  ports:
      - port: {{ .port }}
        targetPort: {{ .port }}
{{- end }}
