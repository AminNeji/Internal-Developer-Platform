apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: idp-project
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/idp_project"
  SPRING_DATASOURCE_USERNAME: "postgres"
  SPRING_DATA_REDIS_HOST: "redis"
  ARGOCD_URL: "http://argocd-server.argocd.svc.cluster.local"
  # comma-separated GitHub usernames allowed to sign in
  IDP_ALLOWED_USERS: "AminNeji"
  # where images built from developers' Git repositories are pushed (BuildService)
  IDP_BUILD_IMAGE_REPOSITORY: "516982327726.dkr.ecr.eu-north-1.amazonaws.com/idp-user-apps"
