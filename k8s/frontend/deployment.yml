apiVersion: apps/v1
kind: Deployment
metadata:
  name: idp-frontend-deployment
  namespace: idp-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: idp-frontend
  template:
    metadata:
      labels:
        app: idp-frontend
    spec:
      containers:
        - name: idp-frontend
          image: 516982327726.dkr.ecr.eu-north-1.amazonaws.com/idp-frontend:35f2822dea9dc939550a650b39937376c418ea7d
          ports:
            - containerPort: 80
          # nginx only serves static files, far less than the dev server needed
          resources:
            requests:
              memory: "32Mi"
              cpu: "20m"
            limits:
              memory: "128Mi"
              cpu: "200m"
