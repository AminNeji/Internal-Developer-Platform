apiVersion: v1
kind: Service
metadata:
  name: idp-backend-service
  namespace: idp-project
  annotations:
    # overrides the Ingress-wide "/" check: Spring has nothing at "/" and every /api path needs a login
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
spec:
  selector:
    app: idp-backend
  ports:
      - port: 8082
        targetPort: 8082
