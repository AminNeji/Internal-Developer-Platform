apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: idp-ingress
  namespace: idp-project
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: "200"

    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-north-1:516982327726:certificate/d196c797-16f7-4c4e-aef7-fc77ef3dd1bb
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'

spec:
  ingressClassName: alb
  rules:
    # host and http belong to the same rule - a second "-" would start a separate rule
    - host: idplatform.tech
      http:
        paths:
          # the ALB checks rules in order and "/" matches everything, so /api must come first
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: idp-backend-service
                port:
                  number: 8082
          - path: /
            pathType: Prefix
            backend:
              service:
                name: idp-frontend-service
                port:
                  number: 4200
