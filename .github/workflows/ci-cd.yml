name: WORKFLOW
on:
  push:
    branches:
      - dev
    paths-ignore:
      - 'k8s/**'
      - 'environments/**'
env:
  ECR_REPOSITORY: 'idp-project'
permissions:
  contents: read

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build the Backend
        run: |
          cd idp-backend
          mvn install -DskipTests
      - name: Notify Build failure
        if: failure()
        run: echo "Build failed"
  Test:
    runs-on: ubuntu-latest
    needs: Build
    # contextLoads boots the whole app, which needs a real Postgres and a GIT_PASSWORD value
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: idp_project
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/idp_project
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      GIT_PASSWORD: not-used-in-tests
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Tests on dev branch
        if: github.ref =='refs/heads/dev'
        run: |
          cd idp-backend
          mvn test

      - name: Checkstyle test
        run: |
          cd idp-backend
          mvn checkstyle:checkstyle

  SecurityScan:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Run Trivy fileseystem scan
        uses: aquasecurity/trivy-action@0.35.0 
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 0
          vuln-type: os,library

  Build_AND_PUSH:
    name: Build and push Docker Images to Amazon ECR
    runs-on: ubuntu-latest
    environment: idp-project
    needs: [Build,Test,SecurityScan]
    permissions:
      contents: write
    if: github.ref == 'refs/heads/dev'
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{vars.AWS_REGION}}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Images to Amazon ECR
        env:
          ECR_REGISTRY: ${{steps.login-ecr.outputs.registry}}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          #BACKEND
          docker build \
            -f idp-backend/Dockerfile \
            -t $ECR_REGISTRY/idp-backend:latest \
            idp-backend/
          docker build \
            -f idp-backend/Dockerfile \
            -t $ECR_REGISTRY/idp-backend:$IMAGE_TAG \
            idp-backend/

          docker push $ECR_REGISTRY/idp-backend:latest
          docker push $ECR_REGISTRY/idp-backend:$IMAGE_TAG

          #FRONTEND
          docker build \
            -f idp-frontend/Dockerfile \
            -t $ECR_REGISTRY/idp-frontend:latest \
            idp-frontend/
          docker build \
            -f idp-frontend/Dockerfile \
            -t $ECR_REGISTRY/idp-frontend:$IMAGE_TAG \
            idp-frontend/
          
          docker push $ECR_REGISTRY/idp-frontend:latest
          docker push $ECR_REGISTRY/idp-frontend:$IMAGE_TAG


          
      - name: Update image tags in k8s manifest
        env:
          ECR_REGISTRY: ${{steps.login-ecr.outputs.registry}}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          export BACKEND_IMAGE="$ECR_REGISTRY/idp-backend:$IMAGE_TAG"
          export FRONTEND_IMAGE="$ECR_REGISTRY/idp-frontend:$IMAGE_TAG"
          yq -i '.spec.template.spec.containers[0].image = strenv(BACKEND_IMAGE)' k8s/backend/deployment.yml
          yq -i '.spec.template.spec.containers[0].image = strenv(FRONTEND_IMAGE)' k8s/frontend/deployment.yml

      - name: Commit and push the new tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/backend/deployment.yml k8s/frontend/deployment.yml
          git commit -m "deploy: ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"